[package]
name = "malm"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Enables crash-injection points for integration tests; release builds reject it.
failpoints = ["malm-engine/failpoints"]

[workspace]
members = [
  ".",
  "crates/malm-archive",
  "crates/malm-authoring",
  "crates/malm-config",
  "crates/malm-commit",
  "crates/malm-engine",
  "crates/malm-format-component-api",
  "crates/malm-format-component-adapter",
  "crates/malm-format-component-host",
  "crates/malm-machine",
  "crates/malm-module-graph",
  "crates/malm-pack",
  "crates/malm-root",
  "crates/malm-store",
  "crates/malm-tree",
  "crates/malm-types",
]

[workspace.package]
edition = "2024"
version = "0.4.0"
authors = ["Christian Bendiksen <christian@bendiksen.me>"]
rust-version = "1.95.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "=2.5.8"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
semicolon_in_expressions_from_macros = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
disallowed_types = "warn"
empty_line_after_outer_attr = "warn"
inefficient_to_string = "warn"
macro_use_imports = "warn"
map_flatten = "warn"
missing_enforced_import_renames = "warn"
mut_mut = "warn"
nonstandard_macro_braces = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
uninlined_format_args = "warn"
unreadable_literal = "warn"
wildcard_imports = "warn"

literal_string_with_formatting_args = "allow"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
malm-authoring = { path = "crates/malm-authoring" }
malm-engine = { path = "crates/malm-engine" }
malm-format-component-adapter = { path = "crates/malm-format-component-adapter" }
malm-machine = { path = "crates/malm-machine" }
malm-pack = { path = "crates/malm-pack" }
malm-root = { path = "crates/malm-root" }
malm-types = { path = "crates/malm-types" }
rustix = { version = "1", features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
filetime = "0.2"
jsonschema = { version = "=0.48.1", default-features = false }
libc = "0.2"
malm-config = { path = "crates/malm-config" }
malm-module-graph = { path = "crates/malm-module-graph" }
malm-tree = { path = "crates/malm-tree" }
pretty_assertions = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
tempfile = "^3.27"
xattr = "1"

[profile.release]
strip         = true
lto           = true
opt-level     = "s"
codegen-units = 1

# Size optimization makes SHA-256 about five times slower. Capture, publication,
# and verification hash every pack byte, so byte-processing crates use full
# optimization while the rest of the binary remains size-optimized.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.lzma-rs]
opt-level = 3

[profile.release.package.cranelift-codegen]
opt-level = 3
